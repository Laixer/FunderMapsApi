name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        # config.ts runs envSchema.parse(process.env) at module load, so any
        # test that transitively imports it needs the required env vars set
        # even if no test actually opens connections to those services.
        # Dummy values are fine — DB-touching tests don't exist in this
        # repo yet, and the auth/s3/mailgun clients are lazily created on
        # first use.
        env:
          DATABASE_URL: postgres://test@localhost:5432/test
          APP_ID: ci-test-app
          AUTH_SECRET: ci-test-secret-not-used-for-anything-real
        run: bun test
